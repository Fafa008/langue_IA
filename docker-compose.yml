# ============================================================
# CENTRE DE LANGUES IA — Stack complète (monorepo) - ISOLÉE (PRE-06)
# ============================================================

name: centre-langues

x-healthcheck-python: &healthcheck-python
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 15s

x-python-env: &python-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-centre_langues}
  POSTGRES_USER: ${POSTGRES_USER:-admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-centre_langues}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  IA_SERVICE_URL: http://ia-service:8001
  IA_SERVICE_TOKEN: ${IA_SERVICE_TOKEN:-}
  CHATBOT_QUOTA_ECHANGES: ${CHATBOT_QUOTA_ECHANGES:-20}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-centre_langues}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - back-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - back-tier
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *python-env
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SEED_DEMO: ${SEED_DEMO:-true}
      IA_SERVICE_URL: http://ia-service:8001
      IA_SERVICE_TIMEOUT_S: ${IA_SERVICE_TIMEOUT_S:-55}
      LLM_API_KEY: ""
      GEMINI_API_KEY: ""
    volumes:
      - media_data:/srv/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - front-tier
      - back-tier   # Le backend est la passerelle : il est sur les deux réseaux
    healthcheck:
      <<: *healthcheck-python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]

  ia-service:
    build:
      context: ./ia-service
      target: prod
    restart: unless-stopped
    environment:
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      ENVIRONNEMENT: ${ENVIRONNEMENT:-dev}
      IA_SERVICE_TOKEN: ${IA_SERVICE_TOKEN:-}
      LLM_FOURNISSEUR: ${LLM_FOURNISSEUR:-factice}
      LLM_FACTICE_SCENARIO: ${LLM_FACTICE_SCENARIO:-demonstration}
      LLM_MODELE: ${LLM_MODELE:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-600}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-12}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_REPRISE_DELAI_S: ${LLM_REPRISE_DELAI_S:-0.5}
      LLM_REPRISE_DELAI_MAX_S: ${LLM_REPRISE_DELAI_MAX_S:-4}
      LLM_BUDGET_TOTAL_S: ${LLM_BUDGET_TOTAL_S:-30}
      RAG_CORPUS_ACTIF: ${RAG_CORPUS_ACTIF:-false}
      RAG_CORPUS_TYPE: ${RAG_CORPUS_TYPE:-officiel}
      RAG_CORPUS_OFFICIEL_AUTORISE: ${RAG_CORPUS_OFFICIEL_AUTORISE:-false}
      RAG_CORPUS_CHEMIN: ${RAG_CORPUS_CHEMIN:-/app/corpus/cecrl}
      RAG_CORPUS_VERIFIER_EMPREINTE: ${RAG_CORPUS_VERIFIER_EMPREINTE:-true}
      # US-IA-CHAT-01 : mémoire courte du tuteur (tours, résumé, cache de traduction).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_TTL_S: ${REDIS_TTL_S:-86400}
      REDIS_TOURS_MAX: ${REDIS_TOURS_MAX:-20}
    volumes:
      - ./ia-service/models:/app/models:ro
      - ./ia-service/corpus:/app/corpus:ro
    depends_on:
      redis:
        condition: service_healthy
    #  SUPPRIMÉ : ports: - "${IA_PORT:-8001}:8001" -> Le service IA n'est plus exposé sur l'hôte !
    networks:
      - back-tier   # Uniquement sur le réseau privé (inaccessible par le frontend)

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_MOCK: ${NEXT_PUBLIC_API_MOCK:-false}
        NEXT_PUBLIC_PARCOURS_MOCK: ${NEXT_PUBLIC_PARCOURS_MOCK:-false}
        NEXT_PUBLIC_PARCOURS_MOCK_SCENARIO: ${NEXT_PUBLIC_PARCOURS_MOCK_SCENARIO:-passif}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - front-tier   # Uniquement sur le réseau public/intermédiaire
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  front-tier:
    driver: bridge
  back-tier:
    driver: bridge