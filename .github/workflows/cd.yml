# Livraison continue : publie les images Docker sur le registre GitHub (GHCR)
#   push sur main     → tags « latest » et « sha-<commit> »
#   tag vX.Y.Z        → tags « X.Y.Z » et « X.Y » (versions de release/vX.Y)
#   lancement manuel  → onglet Actions › CD › Run workflow
#
# Images : ghcr.io/<propriétaire>/<dépôt>-frontend | -backend | -ia-service
# L'URL de l'API intégrée au frontend vient de la variable du dépôt NEXT_PUBLIC_API_URL
# (Settings › Secrets and variables › Actions › Variables), par défaut http://localhost:8000.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend, ia-service]
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (le registre exige des minuscules)
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nom.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Frontend seulement (ignoré par les autres images) : valeurs intégrées au build
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
            NEXT_PUBLIC_API_MOCK=false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
