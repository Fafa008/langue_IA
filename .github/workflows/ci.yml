# Intégration continue : chaque push et chaque pull request doivent passer ces contrôles avant la revue.
#   check     : make check dans les images Docker de développement (backend, IA, frontend)
#   frontend  : build de production
#   e2e       : tests Playwright (bureau + mobile), API simulée par les tests eux-mêmes
#   python    : tests unitaires IA sur Linux, macOS et Windows avec variables d'environnement polluées
#   docker    : construction des images, démarrage de toute la stack (healthchecks), seed de démonstration,
#               construction des images de développement
name: CI

# Push sur les branches d'intégration, et toutes les pull requests (y compris les PR empilées
# dont la base est une autre branche feature/…). Lancement manuel : onglet Actions › CI › Run workflow.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build de production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de production
        run: npm run build

  check-dev-images:
    name: Contrôles complets (images Docker de développement)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Exécuter les mêmes contrôles que make check
        run: make check

  python-unit-tests:
    name: Tests IA (${{ matrix.os }}) avec environnement pollué
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: ia-service
    env:
      GEMINI_API_KEY: valeur-invalide-pour-test
      GEMINI_MODEL: modele-invalide
      LLM_FOURNISSEUR: fournisseur-invalide
      LLM_TIMEOUT: pas-un-nombre
      RAG_CORPUS_ACTIF: valeur-invalide
      RAG_CORPUS_CHEMIN: chemin-invalide
      OPENAI_API_KEY: valeur-invalide-pour-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ia-service/requirements.txt
            ia-service/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests IA sans dépendance à l'environnement du runner
        run: python -m pytest -p no:cacheprovider

  e2e:
    name: Frontend (tests E2E Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Le binaire Chromium vient du CDN Playwright, les paquets système des miroirs Ubuntu. Un incident DNS
      # sur ces derniers ne doit pas faire échouer le job : les images ubuntu-latest fournissent déjà les
      # bibliothèques de Chrome/Chromium. apt n'est donc lancé que si une bibliothèque manque réellement.
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Navigateur Chromium
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for tentative in 1 2 3; do
            if npx playwright install chromium; then
              break
            fi
            echo "::warning::Téléchargement de Chromium échoué (tentative ${tentative}/3)."
            if [ "${tentative}" -eq 3 ]; then
              echo "::error::Chromium reste indisponible après 3 tentatives."
              exit 1
            fi
            sleep $((tentative * 10))
          done

          chrome=$(find ~/.cache/ms-playwright -type f -name chrome -perm -u+x -print -quit 2>/dev/null || true)
          if [ -z "${chrome}" ]; then
            echo "::error::Binaire Chromium introuvable après installation."
            exit 1
          fi
          ldd "${chrome}" > "${RUNNER_TEMP}/chromium-ldd.txt" 2>/dev/null || true
          if grep -q "not found" "${RUNNER_TEMP}/chromium-ldd.txt"; then
            echo "Bibliothèques système manquantes, installation des dépendances Playwright…"
            if ! npx playwright install-deps chromium; then
              echo "::warning title=Dépendances système::Miroirs Ubuntu injoignables ; poursuite avec les bibliothèques du runner."
            fi
          else
            echo "Toutes les bibliothèques de Chromium sont déjà présentes sur le runner."
          fi
      - name: Tests E2E
        run: npm run test:e2e
      - name: Rapport en cas d'échec (traces Playwright)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  docker:
    name: Docker (build et démarrage de la stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, check-dev-images]
    steps:
      - uses: actions/checkout@v4
      - name: Construction des images et démarrage (attente des healthchecks)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Les services répondent
        run: |
          curl --fail --silent http://localhost:8000/health
          # PRE-06 : ia-service est isolé sur back-tier, joignable uniquement par le backend
          docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://ia-service:8001/health', timeout=3)"
          ! curl --silent --connect-timeout 2 http://localhost:8001/health
          curl --fail --silent --output /dev/null http://localhost:3000/login
          # Le backend a migré la base et chargé le référentiel
          curl --fail --silent http://localhost:8000/api/v1/formules | grep -q '"libelle":"Simple"'
      - name: Le seed de démonstration permet de passer le diagnostic
        run: |
          jeton=$(curl --fail --silent -H 'Content-Type: application/json' \
            -d '{"email":"apprenant@digitheque.mg","mot_de_passe":"Demo2026"}' \
            http://localhost:8000/api/v1/auth/login | jq -r .access_token)
          curl --fail --silent -H "Authorization: Bearer $jeton" http://localhost:8000/api/v1/diagnostic/langues \
            | jq -e '[.[] | select(.disponible)] | map(.code) | contains(["en", "fr"])'
      - name: Contrat backend ↔ service IA, appel réel (US157-QA)
        run: docker compose exec -T backend python -m scripts.verifier_contrat_ia
      - name: Le seed est idempotent (second passage, comme au redémarrage du conteneur)
        run: docker compose exec -T backend python -m app.seed
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêt
        if: always()
        run: docker compose down --volumes
      - name: Les images de développement se construisent
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build
