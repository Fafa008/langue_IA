# Intégration continue : chaque push et chaque pull request doivent passer ces contrôles avant la revue.
#   frontend  : typage, lint, tests Jest, build de production
#   e2e       : tests Playwright (bureau + mobile), API simulée par les tests eux-mêmes
#   backend   : ruff, tests pytest sur PostgreSQL, couverture ≥ 70 % (Definition of Done du README)
#   docker    : construction des images, démarrage de toute la stack (healthchecks), seed de démonstration,
#               construction des images de développement (make dev)
name: CI

# Push sur les branches d'intégration, et toutes les pull requests (y compris les PR empilées
# dont la base est une autre branche feature/…). Lancement manuel : onglet Actions › CI › Run workflow.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typage, lint, Jest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typage, lint et tests unitaires
        run: npm run check
      - name: Build de production
        run: npm run build

  e2e:
    name: Frontend (tests E2E Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Le binaire Chromium vient du CDN Playwright, les paquets système des miroirs Ubuntu. Un incident DNS
      # sur ces derniers ne doit pas faire échouer le job : les images ubuntu-latest fournissent déjà les
      # bibliothèques de Chrome/Chromium. apt n'est donc lancé que si une bibliothèque manque réellement.
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Navigateur Chromium
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for tentative in 1 2 3; do
            if npx playwright install chromium; then
              break
            fi
            echo "::warning::Téléchargement de Chromium échoué (tentative ${tentative}/3)."
            if [ "${tentative}" -eq 3 ]; then
              echo "::error::Chromium reste indisponible après 3 tentatives."
              exit 1
            fi
            sleep $((tentative * 10))
          done

          chrome=$(find ~/.cache/ms-playwright -type f -name chrome -perm -u+x -print -quit 2>/dev/null || true)
          if [ -z "${chrome}" ]; then
            echo "::error::Binaire Chromium introuvable après installation."
            exit 1
          fi
          ldd "${chrome}" > /tmp/chromium-ldd.txt 2>/dev/null || true
          if grep -q "not found" /tmp/chromium-ldd.txt; then
            echo "Bibliothèques système manquantes, installation des dépendances Playwright…"
            if ! npx playwright install-deps chromium; then
              echo "::warning title=Dépendances système::Miroirs Ubuntu injoignables ; poursuite avec les bibliothèques du runner."
            fi
          else
            echo "Toutes les bibliothèques de Chromium sont déjà présentes sur le runner."
          fi
      - name: Tests E2E
        run: npm run test:e2e
      - name: Rapport en cas d'échec (traces Playwright)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: centre_langues
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d centre_langues"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Les tests créent et migrent la base centre_langues_test à côté de celle-ci (tests/conftest.py)
      DATABASE_URL: postgresql://admin:changeme@localhost:5432/centre_langues
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # ruff est épinglé dans requirements-dev.txt (même version que `make check`)
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests et couverture
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=70

  ia-service:
    name: Service IA (installation, démarrage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ia-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ia-service/requirements.txt
            ia-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint et formatage
        run: ruff check . && ruff format --check .
      - name: L'application se charge
        run: python -c "from app.main import app; print(app.title)"
      - name: Tests et couverture
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=70

  docker:
    name: Docker (build et démarrage de la stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, backend, ia-service]
    steps:
      - uses: actions/checkout@v4
      - name: Construction des images et démarrage (attente des healthchecks)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Les services répondent
        run: |
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent http://localhost:8001/health
          curl --fail --silent --output /dev/null http://localhost:3000/login
          # Le backend a migré la base et chargé le référentiel
          curl --fail --silent http://localhost:8000/api/v1/formules | grep -q '"libelle":"Simple"'
      - name: Le seed de démonstration permet de passer le diagnostic
        run: |
          jeton=$(curl --fail --silent -H 'Content-Type: application/json' \
            -d '{"email":"apprenant@digitheque.mg","mot_de_passe":"Demo2026"}' \
            http://localhost:8000/api/v1/auth/login | jq -r .access_token)
          curl --fail --silent -H "Authorization: Bearer $jeton" http://localhost:8000/api/v1/diagnostic/langues \
            | jq -e '[.[] | select(.disponible)] | map(.code) | contains(["en", "fr"])'
      - name: Le seed est idempotent (second passage, comme au redémarrage du conteneur)
        run: docker compose exec -T backend python -m app.seed
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêt
        if: always()
        run: docker compose down --volumes
      - name: Les images de développement se construisent (make dev)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build
