# Configuration des outils du backend (le projet s'installe avec requirements.txt)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends(), Query()… en valeur par défaut : idiome FastAPI
